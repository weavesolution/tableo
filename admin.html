<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mood Wala Food — Manager Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0d0d0d; --panel:#171717; --yellow:#ffc400; --yellow-deep:#e6a800;
    --white:#f6f6f2; --muted:#9a9a94; --red:#e3392e; --green:#3fbf5f; --line:#2a2a26;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--black);color:var(--white);
    font-family:"Work Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  }
  h1,h2,.display{font-family:"Anton",sans-serif;font-weight:400;}

  /* ---------- PIN gate ---------- */
  #pin-screen{
    position:fixed;inset:0;background:var(--black);z-index:100;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;text-align:center;
  }
  #pin-screen h1{color:var(--yellow);font-size:26px;margin:0 0 6px;}
  #pin-screen p{color:var(--muted);font-size:13px;margin:0 0 18px;}
  #pin-screen input{
    background:var(--panel);border:1px solid var(--line);color:var(--white);
    font-size:20px;letter-spacing:6px;text-align:center;
    padding:12px;border-radius:10px;width:180px;margin-bottom:12px;
  }
  #pin-screen button{
    background:var(--yellow);color:#161200;border:none;font-weight:800;
    padding:12px 26px;border-radius:10px;font-size:14px;
  }
  #pin-error{color:var(--red);font-size:12.5px;margin-top:10px;display:none;}
  #pin-error.show{display:block;}

  /* ---------- Layout ---------- */
  #app{display:none;min-height:100%;flex-direction:column;}
  #app.show{display:flex;}
  header{
    padding:16px 16px 12px;border-bottom:2px solid var(--yellow);
    display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;background:var(--black);z-index:10;
  }
  header h1{color:var(--yellow);font-size:20px;margin:0;}
  header .sub{color:var(--muted);font-size:11px;margin-top:2px;}
  #refresh-btn{
    background:var(--panel);border:1px solid var(--line);color:var(--white);
    width:38px;height:38px;border-radius:50%;font-size:16px;
  }

  nav.tabs{
    display:flex;position:sticky;top:64px;background:var(--black);z-index:9;
    border-bottom:1px solid var(--line);
  }
  nav.tabs button{
    flex:1;background:none;border:none;color:var(--muted);
    padding:12px 4px;font-weight:700;font-size:13px;position:relative;
  }
  nav.tabs button.active{color:var(--yellow);}
  nav.tabs button.active::after{
    content:'';position:absolute;left:16%;right:16%;bottom:0;height:3px;
    background:var(--yellow);border-radius:3px 3px 0 0;
  }
  .badge{
    display:inline-block;background:var(--red);color:#fff;font-size:10.5px;
    font-weight:800;border-radius:10px;padding:1px 7px;margin-left:5px;
    vertical-align:2px;
  }

  main{flex:1;padding:14px 14px 40px;max-width:680px;margin:0 auto;width:100%;}
  .panel{display:none;}
  .panel.active{display:block;}

  .empty-state{color:var(--muted);text-align:center;padding:50px 16px;font-size:14px;}

  /* ---------- Order card ---------- */
  .order-card{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;margin-bottom:12px;
  }
  .order-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .order-num{
    background:var(--yellow);color:#161200;font-weight:800;font-size:12px;
    border-radius:8px;padding:2px 8px;display:inline-block;margin-bottom:4px;
  }
  .order-name{font-size:16px;font-weight:700;}
  .order-phone{font-size:12.5px;color:var(--yellow-deep);font-weight:600;text-decoration:none;}
  .order-time{font-size:11px;color:var(--muted);white-space:nowrap;}
  .order-items{font-size:13px;color:var(--white);opacity:0.9;margin:8px 0;line-height:1.5;}
  .order-total{font-weight:800;color:var(--yellow);font-size:15px;}
  .order-actions{display:flex;gap:8px;margin-top:10px;}
  .order-actions button{
    flex:1;border:none;border-radius:10px;padding:10px;font-weight:800;font-size:13px;
  }
  .btn-done{background:var(--green);color:#06210d;}
  .btn-reject{background:transparent;color:var(--red);border:1px solid var(--red) !important;}
  .status-badge{
    font-size:10.5px;font-weight:800;border-radius:8px;padding:2px 8px;
    text-transform:uppercase;letter-spacing:.3px;
  }
  .status-Pending{background:#4a3c00;color:var(--yellow);}
  .status-Done{background:#0f3d1c;color:var(--green);}
  .status-Rejected{background:#3d1210;color:var(--red);}

  /* ---------- History controls ---------- */
  .history-controls{
    display:flex;gap:10px;align-items:center;margin-bottom:16px;
  }
  .history-controls input[type=date]{
    flex:1;background:var(--panel);border:1px solid var(--line);color:var(--white);
    padding:10px 12px;border-radius:10px;font-size:14px;
  }
  .history-controls button{
    background:var(--yellow);color:#161200;border:none;font-weight:800;
    padding:10px 16px;border-radius:10px;font-size:13px;white-space:nowrap;
  }
  .day-total{color:var(--muted);font-size:12.5px;margin:-6px 0 14px;}

  /* ---------- Menu tab ---------- */
  .menu-cat{margin-bottom:20px;}
  .menu-cat h3{color:var(--yellow);font-size:17px;margin:0 0 6px;}
  .menu-item-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 0;border-bottom:1px solid var(--line);
  }
  .menu-item-row .mi-name{font-size:14px;font-weight:600;}
  .menu-item-row .mi-price{font-size:12px;color:var(--muted);margin-top:2px;}
  .switch{
    position:relative;width:46px;height:26px;flex:0 0 auto;
  }
  .switch input{opacity:0;width:0;height:0;}
  .slider{
    position:absolute;inset:0;background:var(--line);border-radius:26px;transition:.2s;cursor:pointer;
  }
  .slider::before{
    content:'';position:absolute;width:20px;height:20px;left:3px;top:3px;
    background:var(--muted);border-radius:50%;transition:.2s;
  }
  .switch input:checked + .slider{background:var(--yellow);}
  .switch input:checked + .slider::before{transform:translateX(20px);background:#161200;}
  .menu-item-row.off .mi-name, .menu-item-row.off .mi-price{opacity:0.4;}

  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:var(--panel);border:1px solid var(--line);color:var(--white);
    padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;
    transition:.25s;z-index:200;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div id="pin-screen">
  <h1>🍔 MOOD WALA FOOD</h1>
  <p>Manager access — enter PIN</p>
  <input id="pin-input" type="password" inputmode="numeric" maxlength="6" placeholder="••••">
  <br>
  <button onclick="checkPin()">Enter</button>
  <div id="pin-error">Incorrect PIN, try again.</div>
</div>

<div id="app">
  <header>
    <div>
      <h1>Manager Dashboard</h1>
      <div class="sub" id="last-updated">Loading…</div>
    </div>
    <button id="refresh-btn" onclick="manualRefresh()">⟳</button>
  </header>

  <nav class="tabs">
    <button class="active" data-tab="live" onclick="switchTab('live')">Live Orders<span class="badge" id="live-badge" style="display:none;">0</span></button>
    <button data-tab="history" onclick="switchTab('history')">History</button>
    <button data-tab="menu" onclick="switchTab('menu')">Menu</button>
  </nav>

  <main>
    <section class="panel active" id="panel-live">
      <div id="live-list"><div class="empty-state">Loading live orders…</div></div>
    </section>

    <section class="panel" id="panel-history">
      <div class="history-controls">
        <input type="date" id="history-date">
        <button onclick="loadHistory()">Load</button>
      </div>
      <div class="day-total" id="history-summary"></div>
      <div id="history-list"><div class="empty-state">Pick a date and tap Load.</div></div>
    </section>

    <section class="panel" id="panel-menu">
      <div id="menu-list"><div class="empty-state">Loading menu…</div></div>
    </section>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===================== CONFIG ===================== */
const SCRIPT_URL = "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";
const ADMIN_PIN = "1234"; // change this before sharing the dashboard link
const LIVE_REFRESH_MS = 20000;

/* ===================== MENU DATA (kept in sync with index.html) ===================== */
const MENU = [
  { cat: "Starters", items: [
    ["Veg Lolipop",60],["Cheese Veg Lolipop",70],["Special Pasta",80],
    ["White Sauce Pasta",90],["Hara-Bhara Kabab",70],["Spring Roll",70],
    ["Chatpata Corn",60],["Nachos Bhel",60]
  ]},
  { cat: "French Fries", items: [
    ["Salted Fries",50],["Peri Peri Fries",60],["Cheese Fries",60],["Peri Peri Cheese Fries",70]
  ]},
  { cat: "Maggi", items: [
    ["Plain Maggi",50],["Peri Peri Maggi (Spicy)",60],["Cheese Maggi",60],
    ["Veg Maggi",70],["Paneer Maggi",70],["Cheese Corn Maggi",70],
    ["Cheese Veg Maggi",80],["Schezwan Maggi (Spicy)",80],["Achari Maggi (Spicy)",80]
  ]},
  { cat: "Pizza", note: "Extra Cheese +₹30", items: [
    ["Tomato Pizza",90],["Onion Pizza",90],["Capsicum Pizza",90],["Margarita Pizza",100],
    ["Kulhad Pizza",100],["Cheese Corn Pizza",100],["Cheese Bust Pizza",100],
    ["Mexican Pizza (Pasta)",100],["Paneer Pizza",110],["Tandoori Paneer Pizza",120],
    ["Paneer Peri-Peri Pizza",120],["Farm House Pizza",120],["Garden Veg Loaded Pizza",150]
  ]},
  { cat: "Soup", items: [ ["Instant Soup (Veg / Manchaw)",50] ]},
  { cat: "Shakes", note: "With Ice-Cream +₹20", items: [
    ["Cold Coffee",50],["Thick Cold Coffee",60],["Oreo Shake",60],["Chocolate Shake",60],
    ["Mango Shake",60],["Butter Scotch",60],["Strawberry Shake",60],["Rasmalai Shake",60],
    ["Black Current Shake",60],["Blue Berry Shake",60],["Kit Kat Shake",60],["Biscoff Shake",80]
  ]},
  { cat: "Shakes – Real Ones", items: [
    ["Seeta Phal",80],["Chiku",80],["Mango Shake (Real)",80],["Jamun Shot",80],["Guava",80],["Strawberry (Real)",80]
  ]},
  { cat: "Mocktail (300ml)", items: [
    ["Blue Lagoon Mojito",60],["Green Mint Mojito",60],["Lemon Mojito",60]
  ]},
  { cat: "Sandwich", items: [
    ["Fruit Jam Sandwich",50],["Veg Sandwich",50],["Coleslaw Sandwich",60],["Garlic Bread (2pc baked)",60],
    ["Cheese Veg Sandwich",60],["Potato Sandwich",50],["Potato Cheese Sandwich",60],["Cheese Garlic Sandwich",60],
    ["Chocolate Sandwich",60],["Peri Peri Cheese Sandwich",60],["Mexican Sandwich",60],["Cheese Corn Sandwich",60],
    ["Spanish Corn Sandwich",60],["Cheese Bust Sandwich",60],["Paneer Peri Peri Sandwich",70],
    ["Tandoori Paneer Sandwich",70],["Paneer Makhani Sandwich",70],["Bombay Sandwich",80],["Club Sandwich",100]
  ]},
  { cat: "Burger", items: [
    ["Potato Patty Burger",60],["Cheese Corn Burger",60],["Cheese Veg Burger",60],
    ["Paneer Burger",70],["Paneer Burger + Patty",80],["Kurkure Burger",100]
  ]},
  { cat: "Chinese", items: [
    ["Manchurian",80],["Potato Chilli",90],["Chowmein",100],["Paneer Chilli",100],["Soya Chilli",100]
  ]}
];

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }
function itemKey(catName, itemName){ return slug(catName) + '__' + slug(itemName); }

/* ===================== PIN GATE ===================== */
function checkPin(){
  const val = document.getElementById('pin-input').value.trim();
  if (val === ADMIN_PIN){
    try { localStorage.setItem('moodwala-admin-ok', '1'); } catch(e){}
    document.getElementById('pin-screen').style.display = 'none';
    document.getElementById('app').classList.add('show');
    boot();
  } else {
    document.getElementById('pin-error').classList.add('show');
  }
}
(function initPin(){
  let ok = false;
  try { ok = localStorage.getItem('moodwala-admin-ok') === '1'; } catch(e){}
  if (ok){
    document.getElementById('pin-screen').style.display = 'none';
    document.getElementById('app').classList.add('show');
    window.addEventListener('DOMContentLoaded', boot);
    if (document.readyState !== 'loading') boot();
  }
})();
document.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && document.getElementById('pin-screen').style.display !== 'none') checkPin();
});

/* ===================== TABS ===================== */
let currentTab = 'live';
function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + tab).classList.add('active');
  if (tab === 'live') loadLive();
  if (tab === 'menu') loadMenuTab();
  if (tab === 'history' && document.getElementById('history-list').dataset.loaded !== '1') loadHistory();
}

/* ===================== API HELPER ===================== */
function apiGet(params){
  const qs = new URLSearchParams(params).toString();
  return fetch(SCRIPT_URL + '?' + qs).then(r => r.json());
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove('show'), 2200);
}
function setLastUpdated(){
  document.getElementById('last-updated').textContent = 'Updated ' + new Date().toLocaleTimeString('en-IN');
}

/* ===================== LIVE ORDERS ===================== */
let liveTimer = null;
function loadLive(){
  apiGet({ action: 'liveOrders' }).then(data => {
    renderOrderList('live-list', data.orders || [], true);
    const badge = document.getElementById('live-badge');
    const n = (data.orders || []).length;
    badge.style.display = n > 0 ? 'inline-block' : 'none';
    badge.textContent = n;
    setLastUpdated();
  }).catch(() => showToast('Could not reach the order sheet.'));
}
function startLivePolling(){
  clearInterval(liveTimer);
  liveTimer = setInterval(() => { if (currentTab === 'live') loadLive(); }, LIVE_REFRESH_MS);
}

function renderOrderList(containerId, orders, isLive){
  const el = document.getElementById(containerId);
  if (!orders.length){
    el.innerHTML = `<div class="empty-state">${isLive ? 'No live orders right now.' : 'No orders found for this date.'}</div>`;
    return;
  }
  el.innerHTML = orders.map((o, i) => {
    const time = new Date(o.serverTimestamp).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
    const itemsHtml = (o.items || '').split(' | ').map(s => `• ${s}`).join('<br>');
    const actions = isLive ? `
      <div class="order-actions">
        <button class="btn-done" onclick="setStatus('${o.id}','Done', this)">Mark Done</button>
        <button class="btn-reject" onclick="setStatus('${o.id}','Rejected', this)">Reject</button>
      </div>` : `<span class="status-badge status-${o.status}">${o.status}</span>`;
    return `
      <div class="order-card" id="order-${o.id}">
        <div class="order-top">
          <div>
            <span class="order-num">#${i + 1}</span>
            <div class="order-name">${escapeHtml(o.name)}</div>
            <a class="order-phone" href="tel:${o.phone}">${o.phone}</a>
          </div>
          <div class="order-time">${time}</div>
        </div>
        <div class="order-items">${itemsHtml}</div>
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div class="order-total">₹${o.total}</div>
          ${!isLive ? actions : ''}
        </div>
        ${isLive ? actions : ''}
      </div>`;
  }).join('');
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function setStatus(orderId, status, btnEl){
  const card = document.getElementById('order-' + orderId);
  if (card) card.style.opacity = '0.5';
  apiGet({ action: 'updateStatus', id: orderId, status: status }).then(res => {
    if (res.result === 'success'){
      showToast(status === 'Done' ? 'Order marked done ✔' : 'Order rejected');
      loadLive();
    } else {
      showToast('Update failed: ' + (res.message || 'unknown error'));
      if (card) card.style.opacity = '1';
    }
  }).catch(() => { showToast('Network error updating order.'); if (card) card.style.opacity = '1'; });
}

/* ===================== HISTORY ===================== */
function todayStr(){
  const d = new Date();
  const tzOff = d.getTimezoneOffset() * 60000;
  return new Date(d - tzOff).toISOString().slice(0, 10);
}
function loadHistory(){
  const dateInput = document.getElementById('history-date');
  if (!dateInput.value) dateInput.value = todayStr();
  const date = dateInput.value;
  document.getElementById('history-list').innerHTML = '<div class="empty-state">Loading…</div>';
  apiGet({ action: 'historyOrders', date }).then(data => {
    const orders = data.orders || [];
    document.getElementById('history-list').dataset.loaded = '1';
    renderOrderList('history-list', orders, false);
    const total = orders.filter(o => o.status !== 'Rejected').reduce((s, o) => s + Number(o.total || 0), 0);
    document.getElementById('history-summary').textContent =
      orders.length ? `${orders.length} order${orders.length !== 1 ? 's' : ''} · ₹${total} (excl. rejected)` : '';
  }).catch(() => showToast('Could not reach the order sheet.'));
}

/* ===================== MENU ON/OFF ===================== */
function loadMenuTab(){
  apiGet({ action: 'menuStatus' }).then(data => {
    const disabled = new Set(data.disabled || []);
    renderMenuTab(disabled);
  }).catch(() => showToast('Could not load menu status.'));
}

function renderMenuTab(disabled){
  const el = document.getElementById('menu-list');
  el.innerHTML = MENU.map(cat => `
    <div class="menu-cat">
      <h3>${cat.cat}</h3>
      ${cat.items.map(([name, price]) => {
        const key = itemKey(cat.cat, name);
        const isOff = disabled.has(key);
        return `
          <div class="menu-item-row ${isOff ? 'off' : ''}" id="row-${key}">
            <div>
              <div class="mi-name">${name}</div>
              <div class="mi-price">₹${price}</div>
            </div>
            <label class="switch">
              <input type="checkbox" ${isOff ? '' : 'checked'} onchange="toggleMenuItem('${key}', this)">
              <span class="slider"></span>
            </label>
          </div>`;
      }).join('')}
    </div>
  `).join('');
}

function toggleMenuItem(key, checkboxEl){
  const enabled = checkboxEl.checked;
  const row = document.getElementById('row-' + key);
  row.classList.toggle('off', !enabled);
  apiGet({ action: 'updateMenuItem', key, enabled: String(enabled) }).then(res => {
    if (res.result === 'success'){
      showToast(enabled ? 'Item turned ON' : 'Item turned OFF');
    } else {
      showToast('Could not update item.');
      checkboxEl.checked = !enabled;
      row.classList.toggle('off', enabled);
    }
  }).catch(() => {
    showToast('Network error updating item.');
    checkboxEl.checked = !enabled;
    row.classList.toggle('off', enabled);
  });
}

/* ===================== BOOT ===================== */
function manualRefresh(){
  if (currentTab === 'live') loadLive();
  if (currentTab === 'history') loadHistory();
  if (currentTab === 'menu') loadMenuTab();
}
function boot(){
  document.getElementById('history-date').value = todayStr();
  loadLive();
  startLivePolling();
}
</script>
</body>
</html>
